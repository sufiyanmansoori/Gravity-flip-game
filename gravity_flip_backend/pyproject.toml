[build-system]
requires = ['setuptools>=68']
build-backend = 'setuptools.build_meta'

[project]
name = 'gravity-flip-backend'
version = '1.0.0'
description = 'Production Django backend for Gravity Flip Game'
requires-python = '>=3.12'

[tool.ruff]
line-length = 120
exclude = ['.venv', '.venv-*', 'build', 'staticfiles']

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = 'config.settings.dev'
addopts = '-ra --strict-config'
