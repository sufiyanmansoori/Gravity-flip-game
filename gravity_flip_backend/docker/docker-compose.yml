services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gravity_flip_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes: [gravity_pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: [gravity_redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
  web:
    build: {context: .., dockerfile: docker/Dockerfile}
    env_file: [../.env]
    command: sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    volumes: [gravity_media:/app/media, gravity_static:/app/staticfiles]
    depends_on: {db: {condition: service_healthy}, redis: {condition: service_healthy}}
    ports: ["8000:8000"]
  worker:
    build: {context: .., dockerfile: docker/Dockerfile}
    env_file: [../.env]
    command: celery -A config.celery.app worker --loglevel=INFO
    depends_on: {db: {condition: service_healthy}, redis: {condition: service_healthy}}
  beat:
    build: {context: .., dockerfile: docker/Dockerfile}
    env_file: [../.env]
    command: celery -A config.celery.app beat --loglevel=INFO
    depends_on: {redis: {condition: service_healthy}}
  nginx:
    image: nginx:1.27-alpine
    volumes: [./nginx.conf:/etc/nginx/conf.d/default.conf:ro, gravity_static:/app/staticfiles:ro, gravity_media:/app/media:ro]
    depends_on: [web]
    ports: ["80:80"]
volumes:
  gravity_pgdata:
  gravity_redisdata:
  gravity_media:
  gravity_static:
