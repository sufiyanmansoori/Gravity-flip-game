<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="1024" height="1024">
  <defs>
    <radialGradient id="g1" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#9B8CFF"/>
      <stop offset="60%" stop-color="#00D2FF"/>
      <stop offset="100%" stop-color="#0A0F1B"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark background -->
  <rect width="100%" height="100%" fill="#08101C"/>

  <!-- Neon circular badge -->
  <g filter="url(#glow)">
    <circle cx="128" cy="96" r="76" fill="url(#g1)" />
    <circle cx="128" cy="96" r="64" fill="none" stroke="#C6B7FF" stroke-width="4" opacity="0.18"/>
  </g>

  <!-- Stylized 'G' to represent Gravity Flip -->
  <g transform="translate(72,52) scale(1.15)" fill="#FFFFFF">
    <path d="M58 20c-17 0-30 13-30 30s13 30 30 30c10 0 19-5 24-12l-7-6c-3 5-8 8-17 8-12 0-21-9-21-20s9-20 21-20c6 0 10 1 15 4l5-12c-6-4-12-6-20-6z" fill="#FFFFFF" opacity="0.96"/>
  </g>

  <!-- Subtle top-right accent -->
  <circle cx="200" cy="40" r="6" fill="#00D2FF" opacity="0.9"/>
</svg>